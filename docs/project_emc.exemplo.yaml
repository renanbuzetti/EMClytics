# project_emc.yaml — intenção de projeto, preenchida pelo projetista (exemplo comentado).
# Valores deste arquivo têm PRIORIDADE sobre os inferidos ou importados do formato.
# Unidades: comprimentos em mm, frequências em Hz, tempos em s, impedâncias em Ω.
# Campos com null = "não informado": as regras que dependem deles ficam NÃO VERIFICADAS (nunca aprovadas).

versao_esquema: 1
rascunho: false             # true = ainda não revisado pelo projetista; o relatório mostra isso no cabeçalho e nos avisos

projeto:
  nome: "Placa exemplo"
  revisao: "A"
  # Norma alvo registrada no relatório. As regras em λ são calibradas para IEC 61000-6-1/-3;
  # a base não adapta os limites para outra norma.
  norma_alvo: {nome: "MIL-STD-461", versao: "G", observacao: null}

entrada:
  formato: odbpp            # odbpp | ipc2581 | gerber_x2_356_drill_pnp | altium_script
  arquivos: ["export/placa_odb.tgz"]
  versao_altium: null       # ex.: "24.x" — usada para aplicar a lista de problemas conhecidos de exportação

coordenadas:
  # Posição da ORIGEM RELATIVA do Altium (Edit » Origin » Set) no sistema de coordenadas do arquivo exportado.
  # Permite reportar coordenadas que você encontra no Altium. null = reportar no sistema do arquivo e avisar.
  origem_altium_no_arquivo_mm: null      # ex.: [12.7, 5.08]
  unidades_relatorio: [mm, mil]

frequencias:
  f_max_global_hz: 1.0e+9   # obrigatório para as regras em λ
  # Não há conversão confiável de tr para fMAX. Se você quiser usar tr,
  # declare aqui o fator k em fMAX = k / tr (decisão sua, marcada como 'projetista' no relatório).
  conversao_tr_para_fmax: null

rede_plano_referencia: [GND]   # pode ser outra rede (ex.: ECL)
digital_moderno: true          # RP-116 (≥ 8 camadas para digitais modernos)

nets_criticas:
  - net: CLK_100M
    f_max_hz: 1.0e+9
    driver: U3.12              # refdes.pino do driver (opcional; melhora RP-094/RP-096/RP-097)
  - net_regex: "DDR_DQ[0-9]+"
    f_max_hz: 2.0e+9
  - net: SPI_SCK
    tr_s: 2.0e-9               # só vira fMAX se conversao_tr_para_fmax for definida
    taxa_bits_bps: 2.0e+7      # RP-103 (opcional)

nets_sensiveis: [RESET_N]      # RP-021: linhas internas que pedem o tratamento de interface (ex.: reset)

terras_separadas:              # RP-042: terras (0V) separadas de propósito, com o motivo; os achados delas ficam aceitos
  - {net: GND_ISO, motivo: isolação galvânica (DC-DC isolado)}

classes_de_net:                # usado quando o formato não traz classes (ODB++, Gerber)
  - nome: DIFF_USB
    pares_diferenciais: [[USB_DP, USB_DN]]
    z0_diferencial_ohm: 90
    z0_modo_comum_ohm: null
  - nome: SE50
    nets_regex: ["RF_.*"]
    z0_ohm: 50

zonas:                         # zonas EM: polígono em mm OU room do Altium (script)
  - id: EMZ1
    tipo: interna              # externa (EMZ0) | interna
    poligono_mm: [[0, 0], [100, 0], [100, 80], [0, 80]]
    f_max_hz: 1.0e+9
    componentes_regex: [".*"]
  - id: EMZ2A
    tipo: interna
    room_altium: SMPS
    f_max_hz: 3.0e+8
    componentes: [U10, L1, C40, C41]
    # bls.altura_mm (opcional): altura interna da lata; o RP-158 a usa na diagonal interna (sem ela, só a base)
    bls: {previsto: true, contorno_mm: [[60, 50], [90, 50], [90, 75], [60, 75]]}

conectores_externos:           # condutores que saem do gabinete (EMZ0)
  - refdes: J1
    blindado: false
    filtragem: serie_choke     # serie_choke | serie | shunt | nenhuma
    zona_conector_poligono_mm: null   # null = derivar (envoltória do conector + filtros)
  - refdes: J2
    blindado: true
    filtragem: shunt

conectores_placa_a_placa:
  - refdes: J5
    blindado: false

conversores:
  - nome: "Buck 12V→3V3"
    componentes: [U10, L1]
    f_chaveamento_hz: 5.0e+5
    potencia_w: 10
    capacitores_entrada: [C40]
    capacitores_saida: [C41]
    lacos:                     # RP-087 a RP-089
      chaveador: {nets: [SW, VIN, PGND], componentes: [U10, C40]}
      entrada: {nets: [VIN_RAW, GND], componentes: [J3, C40]}
      saida: {nets: [V3V3, GND], componentes: [L1, C41]}

redes_pwr_ruidosas: [VCORE_0V9]  # RP-129, RP-131

componentes_especiais:
  antenas: [ANT1]
  cristais: [Y1]
  bls: []                      # refdes de footprints de BLS, se houver

pontos_de_bond_chassi:         # RP-060 a RP-068
  - id: MH1
    tipo: direto               # direto | capacitor | gaxeta | opcional
  - id: MH2
    tipo: opcional

mecanica:
  plano_paralelo_ao_chassi: true
  er_meio_bond: 4.0            # RP-061: 4 (padrão, conservador) ou 1.0 (ar)
  diametro_area_pressao_parafuso_mm: 7.0

stackup_manual:                # usado quando o formato não traz stack-up (Gerber) ou para corrigir o importado
  - {nome: L1, tipo: cobre, espessura_mm: 0.035}
  - {nome: D1, tipo: dieletrico, espessura_mm: 0.10, er: 4.2, material: "FR4 prepreg"}
  - {nome: L2, tipo: cobre, espessura_mm: 0.035}
  - {nome: D2, tipo: dieletrico, espessura_mm: 1.20, er: 4.2, material: "FR4 core"}
  - {nome: L3, tipo: cobre, espessura_mm: 0.035}
  - {nome: D3, tipo: dieletrico, espessura_mm: 0.10, er: 4.2, material: "FR4 prepreg"}
  - {nome: L4, tipo: cobre, espessura_mm: 0.035}

parametros:                    # sobrescreve parâmetros das regras (inclusive os que a base deixou sem número)
  RP-110: {raio_max_mm: 2.0}

excecoes_aceitas:              # achados aceitos pelo projetista: aparecem como ACEITO, com justificativa
  - regra: RP-036
    alvo: {net: LED_STATUS}
    justificativa: "Sinal DC; cruzamento avaliado e aceito."
    autor: "Nome do projetista"
    data: "2026-10-29"
